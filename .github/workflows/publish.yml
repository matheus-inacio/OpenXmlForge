# Publishes OpenXmlForge to nuget.org using NuGet Trusted Publishing (OIDC).
# No long-lived NuGet API key is stored anywhere.
#
# Trigger: push a SemVer tag, e.g.  git tag v1.2.3 && git push origin v1.2.3
#
# IMPORTANT: the nuget.org Trusted Publishing policy is bound to this file name
# ("publish.yml") and to the "nuget" environment. Renaming either breaks publishing.

name: Publish to NuGet

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Deny everything by default; each job opts in to the minimum it needs.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required by build provenance attestation (NOT usable for NuGet: policy is bound to the "nuget" environment)
      attestations: write  # required by build provenance attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid SemVer tag (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenXmlForge.slnx

      - name: Build
        run: dotnet build OpenXmlForge.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test OpenXmlForge.slnx --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack src/OpenXmlForge/OpenXmlForge.csproj
          --configuration Release
          --no-build
          --output ./artifacts
          -p:Version=${{ steps.version.outputs.version }}

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment" field of the nuget.org Trusted Publishing policy.
    # Configure protection rules (required reviewers, tag restrictions) on it in GitHub.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/OpenXmlForge/${{ needs.build.outputs.version }}
    permissions:
      id-token: write  # lets this job request a GitHub OIDC token for NuGet/login
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Exchanges the GitHub OIDC token for a short-lived (1h) nuget.org API key.
      # Requested right before pushing so it cannot expire mid-run.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name (NOT email), stored as an environment secret

      # Pushing the .nupkg also pushes the matching .snupkg found next to it.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  github-release:
    name: Create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload assets
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          
          # If a release for this tag already exists (e.g. manually drafted with custom notes),
          # don't fail: just attach the .nupkg and .snupkg binaries to it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Attaching artifacts to it..."
            gh release upload "$TAG" ./artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              $PRERELEASE_FLAG
          fi
