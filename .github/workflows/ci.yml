name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenXmlForge.slnx

      - name: Build
        run: dotnet build OpenXmlForge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenXmlForge.slnx --configuration Release --no-build

      - name: Pack (validation only)
        run: dotnet pack src/OpenXmlForge/OpenXmlForge.csproj --configuration Release --no-build --output ./artifacts
